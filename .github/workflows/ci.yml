# =============================================================================
# TICKET-ADV154 + ADV155 — GitHub Actions CI/CD Pipeline
#
# Triggers on push to main/feature/* and PRs to main.
# Steps: checkout → Java 17 setup → Maven build+test → Liquibase validate →
# Docker build+push to GHCR (only on main).
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/reconx-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/reconx-frontend

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Build, test, coverage gate
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ADV155 — Liquibase changelog validation (dry-run against H2)
      - name: Validate Liquibase changelog
        working-directory: backend
        run: ./mvnw -B liquibase:validate -Dspring.profiles.active=dev

      # Build + test + JaCoCo coverage report (ADV156 gate is in pom.xml)
      - name: Build and test with Maven
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # ---------------------------------------------------------------------------
  # Job 2: Build and push Docker images to GHCR (only on main or version tags)
  # ---------------------------------------------------------------------------
  docker-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Backend image ---
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ---
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
